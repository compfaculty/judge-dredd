[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-dredd-research"
version = "0.1.0"
description = "Evidence-based justice research prototype"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "sqlalchemy>=2.0,<3", "pydantic>=2,<3", "psycopg[binary]>=3,<4", "pypdf>=5,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
science = ["numpy>=1.26", "scipy>=1.12", "pymc>=5"]
notebook = [
 "jupyterlab>=4,<5", "ipykernel>=6,<8", "ipywidgets>=8,<9",
 "matplotlib>=3.8,<4", "numpy>=1.26,<3", "nbclient>=0.10,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
judge_dredd = ["data/eichman/*.json", "data/eichman/*.pdf", "review.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
